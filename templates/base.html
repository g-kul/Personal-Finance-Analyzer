<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Finance Tracker{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar-nav">
  <div class="topbar-inner">
    <span class="brand-name">Finance Tracker</span>
    <nav class="nav">
      <a href="{{ url_for('dashboard') }}" class="nav-item {{ 'active' if active == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('add_transaction') }}" class="nav-item {{ 'active' if active == 'add' }}">Add Transaction</a>
      <a href="{{ url_for('transactions') }}" class="nav-item {{ 'active' if active == 'transactions' }}">Transactions</a>
      <a href="{{ url_for('budget') }}" class="nav-item {{ 'active' if active == 'budget' }}">Budget</a>
      <a href="{{ url_for('reports') }}" class="nav-item {{ 'active' if active == 'reports' }}">Reports</a>
    </nav>
  </div>
</header>
<div class="page">
  <main class="content">
    <header class="topbar">
      <h1>{% block heading %}{% endblock %}</h1>
      {% block subtitle %}{% endblock %}
    </header>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
